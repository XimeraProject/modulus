AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Shared internet-facing Application Load Balancer for the mathematics
  department account. Owns the ALB, its security group, the HTTP to HTTPS
  redirect and the HTTPS listener. Applications (such as the osu-modulus stack)
  attach their own certificates, target groups and host-header rules to the
  exported listener; this stack holds no application routing.

Metadata:
  com.aws.cloudformation.Context:
    must: >-
      Application stacks import this stack's exports, so CloudFormation refuses
      to delete or change an export while one is imported. Delete application
      stacks first. Each application takes its own block of listener rule
      priorities - osu-modulus uses 100-199.

Parameters:
  Name:
    Type: String
    Default: math-shared-alb
    AllowedPattern: '^[a-z][a-z0-9-]{2,31}$'
    Description: Name of the ALB and its security group, and the export prefix.
  DefaultCertificateDomain:
    Type: String
    Description: >-
      Hostname for the listener's default certificate, which an HTTPS listener
      requires. It belongs to the ALB, not to any application. Validated by a
      DNS CNAME the stack waits for.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ALB.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different Availability Zones.

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Ref Name
      GroupDescription: Shared ALB - public HTTP and HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP redirect to HTTPS }
      Tags:
        - { Key: Name, Value: !Ref Name }

  DefaultCertificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          DNS is not in Route 53, so the stack waits in CREATE_IN_PROGRESS until
          the validation CNAME from the stack events exists in DNS.
    Properties:
      DomainName: !Ref DefaultCertificateDomain
      ValidationMethod: DNS
      Tags:
        - { Key: Name, Value: !Ref Name }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref Name
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref SecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: idle_timeout.timeout_seconds, Value: '60' }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref DefaultCertificate
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Not found

Outputs:
  DnsName:
    Description: CNAME target for every hostname served by this ALB (DNS only, not proxied).
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub ${Name}-DnsName
  HttpsListenerArn:
    Description: Listener that applications attach certificates and rules to.
    Value: !Ref HttpsListener
    Export:
      Name: !Sub ${Name}-HttpsListenerArn
  SecurityGroupId:
    Description: Source security group for application ingress rules.
    Value: !Ref SecurityGroup
    Export:
      Name: !Sub ${Name}-SecurityGroupId
  LoadBalancerFullName:
    Description: CloudWatch LoadBalancer dimension value.
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub ${Name}-LoadBalancerFullName
