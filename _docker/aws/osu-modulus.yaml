AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OSU Modulus on ECS (EC2 launch type, Graviton). ECR repository, ECS cluster
  with an Auto Scaling group capacity provider, the app and admin target groups
  and host-header rules on the shared ALB (math-shared-alb stack), the TLS
  certificate for both hostnames, IAM roles, the application secret and log
  groups. The ECS services and task definitions are created and updated by
  _docker/aws/deploy.sh, not by this stack. The database is a separate stack.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [Name, SharedAlbStackName]
      - Label: { default: Hostnames }
        Parameters: [AppHost, AdminHost]
      - Label: { default: Network }
        Parameters: [VpcId, SubnetIds]
      - Label: { default: Container instances }
        Parameters: [InstanceType, MaxInstances, EcsAmiId]

Parameters:
  Name:
    Type: String
    Default: osu-modulus
    AllowedPattern: '^[a-z][a-z0-9-]{2,23}$'
    Description: >-
      Prefix for resource names. The deploy scripts address the ECR repository,
      cluster, roles and log groups by these names (see aws.env).
  SharedAlbStackName:
    Type: String
    Default: math-shared-alb
    Description: Stack that exports the shared ALB's HTTPS listener and security group.
  AppHost:
    Type: String
    Default: osu-app.modulus-learning.org
    Description: Learner, LTI and agent hostname (the app service, DEPLOYMENT_MODE=frontend).
  AdminHost:
    Type: String
    Default: osu-admin.modulus-learning.org
    Description: Admin UI and background jobs hostname (the admin service, DEPLOYMENT_MODE=admin).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the shared ALB, for the target groups and container instances.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Public subnets for the container instances. They get public IPs (no NAT)
      and admit only the shared ALB.
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge, m7g.medium, m7g.large, c7g.large]
    Description: Graviton (arm64) container instance type.
  MaxInstances:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
    Description: >-
      Auto Scaling group maximum. One instance runs both services; the second
      exists so ECS managed scaling can place the extra app task of a rolling
      deploy, then scale back in.
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id
    Description: >-
      ECS-optimized Amazon Linux 2023 arm64 AMI, resolved from the public SSM
      parameter on each stack update.

Resources:
  # ---------------------------------------------------------------- Registry
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: push.sh tags images app-<git sha>; immutable tags keep a deployed tag pointing at one image.
        must: Name must match ECR_REPOSITORY in aws.env.
    Properties:
      RepositoryName: !Ref Name
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 30 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ------------------------------------------------------------------ Secret
  SecretKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub ${Name} application secret encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersKeyThroughIam
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  SecretKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${Name}-secret
      TargetKeyId: !Ref SecretKey

  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          One JSON object holding every secret variable the task definitions
          inject (keys listed in render-task-definitions.mjs). Created empty;
          values are put by an operator, never through this template.
        must: >-
          Never add SecretString or GenerateSecretString here. The LTI and JWT
          keys are held by LMS registrations, so the secret is retained and not
          rotated automatically.
    Properties:
      Name: !Sub ${Name}/production
      Description: !Sub ${Name} application secrets (JSON object)
      KmsKeyId: !Ref SecretKey

  # --------------------------------------------------------------------- IAM
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Name}-ecs-execution
      Description: ECS agent - pull from ECR, write logs, read the application secret
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secret-and-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt SecretKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
              # The task definitions set awslogs-create-group; the groups
              # already exist, but the agent still calls CreateLogGroup.
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource:
                  - !GetAtt AppLogGroup.Arn
                  - !GetAtt AdminLogGroup.Arn

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          The application currently calls no AWS APIs with role credentials
          (S3 and SMTP use keys from the secret). Grant permissions here when
          that changes.
    Properties:
      RoleName: !Sub ${Name}-ecs-task
      Description: Application containers - no AWS permissions yet
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Name}-ecs-instance
      Description: ECS container instances - join the cluster, Session Manager access
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${Name}-ecs-instance
      Roles: [!Ref InstanceRole]

  # -------------------------------------------------------------------- Logs
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${Name}-app
      RetentionInDays: 90

  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${Name}-admin
      RetentionInDays: 90

  # ---------------------------------------------------------- Security group
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Bridge networking with dynamic host ports; ECS registers each task's host port with its target group.
        must: Ingress only from the shared ALB security group. No SSH; use Session Manager.
    Properties:
      GroupName: !Sub ${Name}-instances
      GroupDescription: !Sub ${Name} container instances - shared ALB to dynamic host ports only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${SharedAlbStackName}-SecurityGroupId
          Description: Shared ALB to task dynamic host ports
      Tags:
        - { Key: Name, Value: !Sub '${Name}-instances' }

  # ----------------------------------------------------------------- Cluster
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Name
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          IMDSv2 only, hop limit 1, so containers on the docker bridge cannot
          reach instance credentials; tasks use their task role instead.
    Properties:
      LaunchTemplateName: !Sub ${Name}-ecs
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref InstanceSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 30
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub '${Name}-ecs' }
          - ResourceType: volume
            Tags:
              - { Key: Name, Value: !Sub '${Name}-ecs' }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            cat >> /etc/ecs/ecs.config <<'EOF'
            ECS_CLUSTER=${Cluster}
            ECS_ENABLE_CONTAINER_METADATA=true
            EOF

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Managed by the ECS capacity provider (managed scaling and draining).
          A launch template change does not replace the running instance; start
          an instance refresh to roll it.
    Properties:
      AutoScalingGroupName: !Sub ${Name}-ecs
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: !Ref MaxInstances
      HealthCheckType: EC2
      Tags:
        - Key: AmazonECSManaged
          Value: ''
          PropagateAtLaunch: true

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Metadata:
      com.aws.cloudformation.Context:
        must: Name must match ECS_CAPACITY_PROVIDER in aws.env.
    Properties:
      Name: !Sub ${Name}-ec2
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED
        ManagedDraining: ENABLED

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1

  # ------------------------------------------------- Routing on the shared ALB
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          DNS for modulus-learning.org is at Cloudflare, not Route 53, so the
          stack waits in CREATE_IN_PROGRESS until the validation CNAMEs shown in
          the stack events are added there (DNS only, not proxied).
    Properties:
      DomainName: !Ref AppHost
      SubjectAlternativeNames: [!Ref AdminHost]
      ValidationMethod: DNS
      Tags:
        - { Key: Name, Value: !Ref Name }

  ListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub ${SharedAlbStackName}-HttpsListenerArn
      Certificates:
        - CertificateArn: !Ref Certificate

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Name}-app
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /routes/elb-status
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  AdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Name}-admin
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /routes/elb-status
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  # osu-modulus owns listener rule priorities 100-199 on the shared ALB.
  AppRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: ListenerCertificate
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub ${SharedAlbStackName}-HttpsListenerArn
      Priority: 100
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref AppHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  AdminRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: ListenerCertificate
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub ${SharedAlbStackName}-HttpsListenerArn
      Priority: 110
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref AdminHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AdminTargetGroup

Outputs:
  RepositoryName:
    Description: aws.env ECR_REPOSITORY
    Value: !Ref Repository
  ClusterName:
    Description: aws.env ECS_CLUSTER
    Value: !Ref Cluster
  CapacityProviderName:
    Description: aws.env ECS_CAPACITY_PROVIDER
    Value: !Ref CapacityProvider
  ExecutionRoleArn:
    Description: aws.env EXECUTION_ROLE_ARN
    Value: !GetAtt TaskExecutionRole.Arn
  TaskRoleArn:
    Description: aws.env TASK_ROLE_ARN
    Value: !GetAtt TaskRole.Arn
  SecretArn:
    Description: aws.env SECRET_ARN
    Value: !Ref AppSecret
  AppTargetGroupArn:
    Description: aws.env TARGET_GROUP_APP_ARN
    Value: !Ref AppTargetGroup
  AdminTargetGroupArn:
    Description: aws.env TARGET_GROUP_ADMIN_ARN
    Value: !Ref AdminTargetGroup
  InstanceSecurityGroupId:
    Description: Source security group for the database ingress rule.
    Value: !Ref InstanceSecurityGroup
