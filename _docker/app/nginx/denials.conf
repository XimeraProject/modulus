# Per-server denial rules. Included inside each `server { … }` block.
#
# We return 403 rather than nginx's 444 (close the connection with no
# response): a proxy or load balancer in front of nginx treats an abruptly
# closed connection as a server failure and logs it as an error, whereas a 403
# is a normal "Forbidden" response that still blocks the request.

if ($bad_bot) {
  return 403;
}

if ($bad_referer) {
  return 403;
}
