worker_processes auto;

error_log stderr warn;
pid /run/nginx.pid;

worker_rlimit_nofile 2048;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Bot and referrer classification. Included here rather than lower down
  # because the `$loggable` map below consumes `$bad_bot`.
  include /etc/nginx/botlist.conf;

  log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        '$request_time $upstream_response_time $pipe $upstream_cache_status';

  # Skip access logs for healthcheck noise.
  map $request $loggable_request {
    ~*elb-status 0;
    default 1;
  }

  # A blocked bot answers 403 without an upstream call, but it still wrote a
  # line per attempt and crawlers do not stop when refused. Log only what is
  # neither a health check nor a blocked bot: concatenating the two flags,
  # "01" is the sole combination worth recording.
  map "$bad_bot$loggable_request" $loggable {
    default 0;
    "01" 1;
  }

  access_log /dev/stdout main_timed if=$loggable;
  error_log /dev/stderr warn;

  # Temp paths under /tmp so the non-privileged nginx user can write.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp_path;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Real client address. The immediate peer is the AWS Application Load
  # Balancer inside the VPC, which appends the visitor's address to
  # X-Forwarded-For. Without this every request appears to come from the ALB and
  # all visitors share one rate-limit bucket. Narrow these ranges to the VPC's
  # CIDR once it is known.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Optional: CloudFront in front of the ALB. Trust CloudFront's ranges as well
  # and use its viewer address (IP:port; realip accepts an optional port).
  # Requires the AllViewerAndCloudFrontHeaders-2022-06 origin request policy.
  # include /etc/nginx/cloudfront-realip.conf;
  # real_ip_header CloudFront-Viewer-Address;

  real_ip_recursive on;

  # Per-IP connection cap (32k slots).
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # Per-IP request rate limits. Hashed build chunks (`/_build/`) and fonts
  # (`/fonts/`) are not rate-limited: they are served from disk by their own
  # top-level locations below, which inherit no `limit_req`. A cold page load
  # (first visit, or any visit after a deploy renames every chunk) fetches
  # dozens of chunks at once and would otherwise exhaust the burst.
  limit_req_zone $binary_remote_addr zone=baserate:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=securerate:10m rate=3r/s;
  limit_req_zone $binary_remote_addr zone=analytics:10m rate=5r/s;
  limit_req_zone $good_bot zone=goodbot:10m rate=2r/s;

  # WebSocket upgrade: `Connection: upgrade` only when the client asked for
  # one. Consumed by `proxy_nodejs.conf`.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # TLS terminates at the ALB, so $scheme here is always http. Pass the ALB's
  # X-Forwarded-Proto upstream, falling back to $scheme for direct requests
  # (local docker compose). Consumed by `proxy_nodejs.conf`.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  client_header_timeout 120;
  client_body_timeout 120;
  keepalive_timeout 120 120;
  send_timeout 120;
  keepalive_requests 1000;
  reset_timedout_connection on;

  sendfile on;
  tcp_nodelay on;
  tcp_nopush on;

  gzip on;
  gzip_buffers 16 8k;
  gzip_comp_level 2;
  gzip_http_version 1.1;
  gzip_min_length 1024;
  gzip_types text/plain application/json text/css application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon application/vnd.ms-fontobject font/opentype application/x-font-ttf image/svg+xml;
  gzip_vary on;
  gzip_proxied any;
  gzip_disable "msie6";

  server_tokens off;
  variables_hash_max_size 1024;

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  include /etc/nginx/nginx_status_allowed_hosts.conf;
  include /etc/nginx/blockips.conf;

  # Loopback-only nginx stub_status endpoint.
  server {
    listen 127.0.0.1:8001;
    server_name localhost;
    location /nginx_status {
      stub_status on;
      access_log off;
      allow 127.0.0.1;
      deny all;
    }
  }

  # Main server.
  server {
    listen 8000 default_server;
    server_name _;
    # TanStack Start / Nitro emits client assets and `public/` here.
    root /app/.output/public;

    resolver 8.8.8.8 ipv6=off;

    limit_conn perip 70;
    client_body_buffer_size 1M;
    client_max_body_size 100M;

    # Emit a RELATIVE Location header on every redirect nginx generates.
    #
    # nginx builds an absolute redirect from $scheme://$host:$server_port, and
    # behind a TLS-terminating proxy all three are wrong: nginx listens on 8000
    # (not public) and sees plain http, so `return 301 /x` would go out as
    # `http://<host>:8000/x`. A relative Location is resolved by the client
    # against the request URL, so the public scheme, host and port are kept.
    absolute_redirect off;

    include /etc/nginx/denials.conf;

    # ALB target-group healthcheck, answered by Node so a stopped or hung app
    # fails the check and the target is replaced.
    location = /routes/elb-status {
      proxy_pass http://127.0.0.1:3000;
      include /etc/nginx/proxy_nodejs.conf;
    }

    location = /robots.txt {
      access_log off;
    }

    # Hashed build chunks. Vite writes every chunk to `.output/public/_build`
    # (`build.assetsDir: '_build'` in vite.config.ts), so they are served from
    # disk only: a miss is a stale or bogus URL and gets a plain 404 here rather
    # than reaching Node. A top-level `^~` prefix location wins over regex
    # locations and inherits no rate limit. No `always` on the header, so a 404
    # is never marked immutable for a CDN to keep.
    location ^~ /_build/ {
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Self-hosted font files, copied from `public/fonts`. Not hash-fingerprinted,
    # but the filename is effectively a stable identifier — we don't rotate fonts
    # in place. Same disk-only, unthrottled treatment as `/_build/`.
    location ^~ /fonts/ {
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Learner and admin sign-in, in either locale (/sign-in, /es/sign-in,
    # /admin/sign-in, /es/admin/sign-in) — strict securerate bucket.
    location ~ ^/(es/)?(admin/)?sign-in(/|$) {
      limit_req zone=securerate burst=3 nodelay;
      limit_req_status 429;
      proxy_buffering off;
      try_files $uri @nodejs;
    }

    location / {
      limit_req zone=baserate burst=70 nodelay;
      limit_req zone=goodbot burst=3 nodelay;
      limit_req_status 429;

      expires 30d;
      try_files $uri @nodejs;
    }

    location @nodejs {
      proxy_pass http://127.0.0.1:3000;
      proxy_buffering off;
      include /etc/nginx/proxy_nodejs.conf;
    }
  }
}
