# Bot user-agent classification. Included from `nginx.conf` (http block).
# `$bad_bot` and `$bad_referer` are consumed by `denials.conf` (server block).
# `$good_bot` is consumed as a rate-limit key in the `goodbot` zone.

# Block these UAs outright (403).
map $http_user_agent $bad_bot {
    default 0;
    ~*^Lynx 0;
    ~*(meta-externalagent|meta-webindexer|PetalBot|Scrapy|ltx71|httrack|htmlparser|libwww|11A465|Ahrefs|ArchiveBot|AspiegelBot|Baiduspider|BLEXBot|Bytespider|Curebot|Daum|Detectify|DotBot|Grapeshot|heritrix|Kinza|LieBaoFast|Linguee|LMY47V|MauiBot|Mb2345Browser|MegaIndex|MJ12bot|MQQBrowser|PageFreezer|PiplBot|Riddler|Screaming\.Frog|Search365bot|SearchBlox|Seekport|SemanticScholarBot|SemrushBot|SEOkicks|serpstatbot|Siteimprove\.com|Sogou\.web\.spider|trendictionbot|Turnitin|UCBrowser|weborama-fetcher|Vagabondo|VelenPublicWebCrawler|YandexBot|YisouSpider) 1;
}

# Legitimate crawlers we allow through but rate-limit (see `goodbot` zone).
map $http_user_agent $good_bot {
    default "";
    ~*(Googlebot|Googlebot-Mobile|Google-Extended|bingbot|FacebookBot|GPTBot|ChatGPT-User|ClaudeBot|Claude-Web|PerplexityBot|CCBot) 1;
}

# Block referrers commonly associated with spam / cloaking.
map $http_referer $bad_referer {
    default 0;
    ~*(adult|babes|click|diamond|forsale|girl|jewelry|love|nudit|organic|poker|porn|poweroversoftware|sex|teen|webcam|zippo|casino|replica) 1;
}

# Allowlist internal sources from referrer checks.
geo $bad_referer {
    127.0.0.1 0;
    192.168.1.0/24 0;
}
