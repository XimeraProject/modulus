proxy_http_version 1.1;
# WebSocket upgrade: `$connection_upgrade` (nginx.conf) sends `upgrade` only
# when the client asked for one, and `close` otherwise.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
# Overwrite client-supplied values on every path to Node. nginx has already
# restored the verified client address through its real-ip policy.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Private analytics identity boundary.
proxy_set_header X-Byline-Client-IP $remote_addr;
proxy_set_header X-Byline-Client-Country "";
proxy_cache_bypass $http_upgrade;

# Mitigate HTTPoxy. https://www.nginx.com/blog/mitigating-the-httpoxy-vulnerability-with-nginx/
proxy_set_header Proxy "";

# Hide upstream identification headers.
proxy_hide_header X-Powered-By;

proxy_connect_timeout 120s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
