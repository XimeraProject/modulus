packages:
  - .
# Native and build-time packages whose install scripts must run. protobufjs
# arrives through the Google reCAPTCHA client.
allowBuilds:
  esbuild: true
  lightningcss: true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  argon2: true
  bcrypt: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@modulus-learning/core@0.12.0'
  - '@modulus-learning/host-tanstack-start@0.12.0'
  - '@modulus-learning/lms-canvas@0.12.0'
  - '@modulus-learning/lti@0.12.0'
