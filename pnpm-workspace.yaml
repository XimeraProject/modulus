packages:
  - .
# Native and build-time packages whose install scripts must run. protobufjs
# arrives through the Google reCAPTCHA client.
allowBuilds:
  esbuild: true
  lightningcss: true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  argon2: true
  bcrypt: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@modulus-learning/core@0.13.0'
  - '@modulus-learning/host-tanstack-start@0.13.0'
  - '@modulus-learning/lms-canvas@0.13.0'
  - '@modulus-learning/lti@0.13.0'
  - '@infonomic/uikit@6.9.1'
  - '@aws-sdk/client-s3@3.1173.0'
  - lucide-react@1.77.0
  - nodemailer@10.6.1
  - tailwind-merge@3.7.1
  - undici@8.13.0
